name: Cero checks

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: cero-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
