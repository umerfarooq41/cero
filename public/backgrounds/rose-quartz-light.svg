<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff7fb"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.36"/>
      <stop offset="0.58" stop-color="#fb7185" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#e879f9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#f9a8d4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="250" cy="185" rx="520" ry="360" fill="url(#orb1)" transform="rotate(-12 250 185)"/>
    <ellipse cx="1325" cy="180" rx="460" ry="340" fill="url(#orb2)" transform="rotate(18 1325 180)"/>
    <ellipse cx="965" cy="1010" rx="670" ry="390" fill="url(#orb3)" transform="rotate(-8 965 1010)"/>
    <ellipse cx="-60" cy="1015" rx="450" ry="310" fill="#e879f9" opacity="0.42"/>
  </g>
  <g fill="none" stroke="#0f172a" stroke-opacity="0.035" stroke-width="1.2">
    <path d="M-120 355 C 210 255, 390 510, 735 388 S 1240 180, 1740 320"/>
    <path d="M-160 725 C 220 645, 482 900, 830 762 S 1220 520, 1720 710"/>
    <path d="M-80 1030 C 260 890, 505 1110, 812 972 S 1220 810, 1660 940"/>
  </g>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="1"/>
