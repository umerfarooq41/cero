<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Blue Ruby - Light" preserveAspectRatio="xMidYMid slice">
  <title>Blue Ruby - Light</title>
  <rect width="1600" height="1000" fill="#eef6ff"/>
  <defs>
    <filter id="blur90" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blur120" x="-42%" y="-42%" width="184%" height="184%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="softVignette" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="66%" stop-color="#000000" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="darkVignette" cx="50%" cy="42%" r="84%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
    </radialGradient>
  </defs>
  <g filter="url(#blur90)" opacity="1">
    <ellipse cx="250" cy="220" rx="590" ry="370" fill="#60a5fa" opacity="0.7"/>
    <ellipse cx="1180" cy="250" rx="650" ry="410" fill="#fb7185" opacity="0.36"/>
    <ellipse cx="820" cy="840" rx="760" ry="300" fill="#93c5fd" opacity="0.34"/>
    <path d="M-160,720 C120,360 440,180 780,360 C1040,500 1230,200 1780,40 L1780,1120 L-160,1120 Z" fill="#fb7185" opacity="0.14"/>
  </g>
  <rect width="1600" height="1000" fill="rgba(255,255,255,0.15)"/>
  <rect width="1600" height="1000" fill="url(#softVignette)"/>
  <rect width="1600" height="1000" filter="url(#noise)" opacity="0.08"/>
</svg>