<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json?v=20260527-icons-v1" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="color-scheme" content="dark light" />

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cero" />

  <!-- Icons -->
  <link id="favicon" rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-light.png" media="(prefers-color-scheme: light)" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon-dark.png" />


  <style>
    html,
    body,
    #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #0a0a1a;
    }

    body,
    #root {
      min-height: 100dvh;
    }
  </style>

  <title>Cero</title>
</head>

<body>
  <div id="root"></div>

  <!-- React -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Auto Light/Dark Icon Switching -->
  <script>
    function setFavicon() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const favicon = document.getElementById('favicon');

      if (!favicon) return;

      favicon.href = isDark
        ? '/favicon-32x32-dark.png'
        : '/favicon-32x32-light.png';

      const appleTouchIcon = document.getElementById('apple-touch-icon');
      if (appleTouchIcon) {
        appleTouchIcon.href = isDark
          ? '/apple-touch-icon-dark.png'
          : '/apple-touch-icon-light.png';
      }
    }

    setFavicon();

    window
      .matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', setFavicon);
  </script>
</body>
</html>
