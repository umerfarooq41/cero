<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a1a" />

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cero" />

  <!-- Icons -->
  <link id="favicon" rel="icon" type="image/png" href="/icon-dark.png" />
  <link rel="apple-touch-icon" href="/icon-dark.png" />

  <title>Cero</title>
</head>

<body>
  <div id="root"></div>

  <!-- React -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Auto Light/Dark Icon Switching -->
  <script>
    function setFavicon() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const favicon = document.getElementById('favicon');

      if (!favicon) return;

      favicon.href = isDark
        ? '/icon-dark.png'
        : '/icon-light.png';
    }

    setFavicon();

    window
      .matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', setFavicon);
  </script>
</body>
</html>
